# Generated by Aegis. Review before committing.
# Actions are pinned to commit SHAs (Dependabot keeps them current); each
# job reports rather than fails the build -- tighten once findings are triaged.
name: security
'on':
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  trivy:
    name: Dependencies, secrets & IaC (Trivy)
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.58.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Trivy)
        run: trivy fs --scanners vuln,secret,misconfig --format sarif --output results.sarif
          --exit-code 0 .
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-report
          path: results.sarif
  checkov:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          output_format: sarif
          output_file_path: results.sarif
          soft_fail: true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: checkov-report
          path: results.sarif
  hadolint:
    name: Container (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: results.sarif
          no-fail: true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: hadolint-report
          path: results.sarif
